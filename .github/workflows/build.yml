# Builds the Android app on GitHub's servers on every push.
# - Every run: runs the core tests, builds the APK, attaches it to the run (Actions tab > run > Artifacts).
# - Pushes to the default branch also update a release called "latest", so the
#   phone can download the APK directly from the Releases page (no zip, no login
#   needed for a public repository).
name: Build Android app

on:
  push:
  pull_request:
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed to update the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Files uploaded through the website lose their "executable" flag.
      - run: chmod +x gradlew

      - name: Core tests (parser, statistics, simulator)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RocketGS-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: RocketGS-debug-apk
          path: RocketGS-debug.apk

      - name: Update the "latest" release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RocketGS-debug.apk \
            --prerelease --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Built from commit $GITHUB_SHA. Download RocketGS-debug.apk on the phone and open it to install."
